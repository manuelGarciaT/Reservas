spring:
  application:
    name: user-service

  profiles:
    active: local

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  data:
    web:
      pageable:
        max-page-size: 100

app:
  jwt:
    # Clave de desarrollo. En docker/prod se sobreescribe con la variable de entorno JWT_SECRET (via config-server).
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-1234567890}
    expiration-minutes: 60

server:
  port: ${PORT:8081}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    enabled: false
