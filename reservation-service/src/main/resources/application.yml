spring:
  application:
    name: reservation-service

  profiles:
    active: local

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  data:
    web:
      pageable:
        max-page-size: 100

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Si Kafka no esta disponible, fallar rapido en vez de bloquear el hilo del request
        # hasta max.block.ms (default 60s) esperando metadata del topic.
        max.block.ms: 2000

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-1234567890}
  kafka:
    reservation-events-topic: reservation-events

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:reservationdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    enabled: false
