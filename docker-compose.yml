x-common-env: &common-env
  EUREKA_URL: http://discovery-server:8761/eureka
  CONFIG_SERVER_URL: http://config-server:8888
  JWT_SECRET: dev-only-secret-key-change-me-please-1234567890

services:
  # --- Infraestructura ---

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    ports:
      - "8888:8888"

  kafka:
    image: apache/kafka:3.7.0
    container_name: reservas-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # Postgres exclusivo para correr los tests *PostgresIT desde el host
  # (docker compose up -d postgres-test) - no forma parte de la stack "real".
  postgres-test:
    image: postgres:16-alpine
    container_name: reservas-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb

  # --- Postgres por servicio (perfil docker) ---

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  resource-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resourcedb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  reservation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservationdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notificationdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Servicios de negocio ---

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: user-db
      DB_NAME: userdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8081:8081"

  resource-service:
    build:
      context: .
      dockerfile: resource-service/Dockerfile
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: resource-db
      DB_NAME: resourcedb
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      resource-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8082:8082"

  reservation-service:
    build:
      context: .
      dockerfile: reservation-service/Dockerfile
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: reservation-db
      DB_NAME: reservationdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      reservation-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8083:8083"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: notification-db
      DB_NAME: notificationdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      notification-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8084:8084"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *common-env
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
      user-service:
        condition: service_started
      resource-service:
        condition: service_started
      reservation-service:
        condition: service_started
      notification-service:
        condition: service_started
    ports:
      - "8080:8080"
